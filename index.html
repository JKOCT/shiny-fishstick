<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Marks</title>

<!--
  =====================================================================
  FIRST MARKS — an incremental game about the invention of writing
  =====================================================================
  This whole game lives in this one file. It has three parts:

    1. <style>   — how things LOOK (colors, sizes, layout)
    2. <body>    — what is ON the page (boxes, buttons, text)
    3. <script>  — how the game WORKS (numbers, rules, saving)

  To play: double-click this file to open it in your web browser.
  To change something: edit this file, save, and refresh the browser.

  The easiest place to start tinkering is the "GAME SETTINGS" section
  near the top of the <script> part below. It has three lists:
  PEOPLE, DISCOVERIES and EVENTS.
  =====================================================================
-->

<style>
  /* ---------- Colors (change these to re-theme the whole game) ---------- */
  :root {
    --bg: #1a1410;          /* page background: dark earth */
    --panel: #2a211a;       /* boxes */
    --panel-light: #382c22;
    --text: #f1e6d6;        /* main text: bone */
    --muted: #b19f88;       /* dim text */
    --marks: #e8a65d;       /* ochre — the color of Marks */
    --ideas: #8fd3e8;       /* pale blue — the color of Ideas */
    --good: #9bd67a;        /* "you can afford it" green */
    --choice: #d9a3f0;      /* crossroads purple */
    --rock-1: #5a4a3c;      /* cave wall colors */
    --rock-2: #3b3029;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
  }

  h1 { text-align: center; margin: 4px 0 2px; color: var(--marks); letter-spacing: 2px; }
  .era { text-align: center; color: var(--muted); margin-bottom: 16px; font-style: italic; }
  h2 { margin: 0 0 10px; font-size: 1.05rem; color: var(--muted); font-weight: normal; }

  .game {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 760px) {           /* phones: one column */
    .game { grid-template-columns: 1fr; }
  }

  .panel { background: var(--panel); border-radius: 12px; padding: 14px; }
  .panel + .panel { margin-top: 16px; }

  /* ---------- Resource counters ---------- */
  .resources { display: flex; gap: 12px; margin-bottom: 8px; }
  .resource { flex: 1; background: var(--panel-light); border-radius: 10px; padding: 10px; text-align: center; }
  .resource .big  { font-size: 1.8rem; font-weight: bold; }
  .resource .small { font-size: 0.85rem; color: var(--muted); }
  .marks-color { color: var(--marks); }
  .ideas-color { color: var(--ideas); }
  .hidden { display: none !important; }

  /* Active temporary effects, like "Clicks ×5 (12s)" */
  .effects { min-height: 1.4em; margin-bottom: 8px; font-size: 0.85rem; text-align: center; }
  .effect { display: inline-block; margin: 0 4px; padding: 1px 8px; border-radius: 99px; background: var(--panel-light); }
  .effect.good { color: var(--good); }
  .effect.bad  { color: #f08a7a; }

  /* ---------- Random event card ---------- */
  .event {
    background: #3a2c1f;
    border: 2px solid var(--marks);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 12px;
    animation: pop 0.3s ease-out;
  }
  @keyframes pop { from { transform: scale(0.9); opacity: 0; } }
  .event-title { font-weight: bold; font-size: 1.1rem; color: var(--marks); }
  .event-text  { margin: 4px 0 10px; }
  .event-choices { display: flex; gap: 8px; flex-wrap: wrap; }
  .event-choices button {
    flex: 1 1 180px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--muted); background: var(--panel-light); color: var(--text); font: inherit;
  }
  .event-choices button:hover { border-color: var(--good); }
  .event-timer { height: 4px; background: var(--marks); border-radius: 2px; margin-top: 10px; transition: width 0.1s linear; }

  /* ---------- The cave wall you click ---------- */
  .wall {
    position: relative;
    height: 340px;
    border-radius: 14px;
    overflow: hidden;
    cursor: crosshair;
    user-select: none;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.06), transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(0,0,0,0.35), transparent 60%),
      linear-gradient(135deg, var(--rock-1), var(--rock-2));
    box-shadow: inset 0 0 40px rgba(0,0,0,0.7);
  }
  .wall-hint {
    position: absolute; inset: auto 0 10px 0; text-align: center;
    color: rgba(255,255,255,0.45); font-size: 0.9rem; pointer-events: none;
  }
  /* One carved symbol on the wall */
  .glyph {
    position: absolute;
    color: rgba(240, 215, 180, 0.75);
    text-shadow: 1px 1px 0 rgba(0,0,0,0.6), -1px -1px 0 rgba(255,255,255,0.08);
    filter: grayscale(1) sepia(0.6) brightness(1.1);  /* makes emoji look carved */
    pointer-events: none;
    white-space: nowrap;
    animation: carve 0.4s ease-out;
  }
  .glyph.painted { filter: saturate(0.7); }           /* after Pigments: real color */
  @keyframes carve { from { opacity: 0; transform: scale(1.6); } }

  /* The glowing crack you can click for a bonus */
  .crack {
    position: absolute; font-size: 30px; cursor: pointer; z-index: 2;
    transform: translate(-50%, -50%);
    animation: glow 0.8s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { text-shadow: 0 0 6px #ffd36e; transform: translate(-50%, -50%) scale(1); }
    to   { text-shadow: 0 0 22px #ffd36e, 0 0 40px #ff9f40; transform: translate(-50%, -50%) scale(1.25); }
  }

  /* ---------- Shop buttons (people + discoveries) ---------- */
  .shop-item {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    width: 100%; padding: 9px 12px; margin-bottom: 8px;
    border: 2px solid transparent; border-radius: 10px;
    background: var(--panel-light); color: var(--text);
    font: inherit; text-align: left; cursor: pointer;
  }
  .shop-item.affordable { border-color: var(--good); }
  .shop-item:disabled   { opacity: 0.5; cursor: not-allowed; }
  .shop-item.crossroads { border-style: dashed; border-color: var(--choice); }
  .shop-item.crossroads.affordable { border-style: solid; }
  .shop-item .name  { font-weight: bold; }
  .shop-item .desc  { font-size: 0.82rem; color: var(--muted); }
  .shop-item .choice-label { font-size: 0.8rem; color: var(--choice); margin-bottom: 2px; }
  .shop-item .owned { font-size: 1.3rem; font-weight: bold; min-width: 2ch; text-align: right; }

  .discovered-list { font-size: 1.3rem; margin-top: 6px; letter-spacing: 4px; }
  .discovered-list span { cursor: help; }
  .unknown { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }

  /* ---------- Story log ---------- */
  .log { margin-top: 12px; max-height: 170px; overflow-y: auto; font-size: 0.9rem; }
  .log p { margin: 0 0 6px; color: var(--muted); }
  .log p:first-child { color: var(--text); }

  .footer { max-width: 1100px; margin: 16px auto 0; text-align: center; color: var(--muted); font-size: 0.85rem; }
  .footer button {
    background: none; border: 1px solid var(--muted); color: var(--muted);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit;
  }

  /* Little "+1" that floats up when you click */
  .floater {
    position: fixed; pointer-events: none; font-weight: bold; color: var(--marks);
    animation: floatUp 0.8s ease-out forwards; z-index: 5;
  }
  @keyframes floatUp { to { opacity: 0; transform: translateY(-45px); } }
</style>
</head>

<body>
  <h1>FIRST MARKS</h1>
  <div class="era" id="eraName"></div>

  <div class="game">
    <!-- LEFT: resources, events, the cave wall, and the story -->
    <div class="panel">
      <div class="resources">
        <div class="resource">
          <div class="big marks-color" id="marks">0</div>
          <div class="small">marks · <span id="marksPerSecond">0</span>/sec</div>
        </div>
        <div class="resource hidden" id="ideasBox">
          <div class="big ideas-color" id="ideas">0</div>
          <div class="small">ideas · <span id="ideasPerSecond">0</span>/sec</div>
        </div>
      </div>
      <div class="effects" id="effects"></div>

      <div class="event hidden" id="eventCard">
        <div class="event-title" id="eventTitle"></div>
        <div class="event-text" id="eventText"></div>
        <div class="event-choices" id="eventChoices"></div>
        <div class="event-timer" id="eventTimer"></div>
      </div>

      <div class="wall" id="wall">
        <div class="wall-hint" id="wallHint">Click the cave wall to carve a mark</div>
      </div>

      <div class="log" id="log"></div>
    </div>

    <!-- RIGHT: the people who join you, and the discoveries -->
    <div>
      <div class="panel">
        <h2>People (carve marks for you)</h2>
        <div id="people"></div>
      </div>
      <div class="panel hidden" id="discoveriesPanel">
        <h2>Discoveries (spend ideas)</h2>
        <div id="discoveries"></div>
        <div class="discovered-list" id="discoveredList"></div>
        <div class="unknown" id="unknownCount"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    Your game saves automatically. &nbsp; <button id="resetButton">Start over</button>
  </div>

<script>
/* =====================================================================
   GAME SETTINGS — the fun part to change!
   ===================================================================== */

// ---------------------------------------------------------------------
// PEOPLE who join you and carve on their own.
//   cost            = marks needed for the first one (it gets pricier each time)
//   marksPerSecond  = marks ONE of them carves each second
//   ideasPerSecond  = ideas ONE of them comes up with each second
//   needs           = which discovery must happen before they appear ("" = none)
// ---------------------------------------------------------------------
const PEOPLE = [
  { id: "child",       name: "Curious Child", emoji: "🧒", cost: 15,      marksPerSecond: 0.2,  ideasPerSecond: 0.05, needs: "",
    joinText: "A curious child watches you, then picks up a sharp stone too." },
  { id: "hunter",      name: "Hunter",        emoji: "🏹", cost: 100,     marksPerSecond: 1,    ideasPerSecond: 0,    needs: "",
    joinText: "A hunter starts scratching a line for every animal caught." },
  { id: "elder",       name: "Elder",         emoji: "🧓", cost: 400,     marksPerSecond: 2,    ideasPerSecond: 0.25, needs: "",
    joinText: "An elder sits by the wall and wonders what the marks could mean." },
  { id: "storyteller", name: "Storyteller",   emoji: "🗣️", cost: 2000,    marksPerSecond: 8,    ideasPerSecond: 1,    needs: "pictograms",
    joinText: "A storyteller begins painting the tales told around the fire." },
  { id: "merchant",    name: "Merchant",      emoji: "🧺", cost: 3000,    marksPerSecond: 15,   ideasPerSecond: 0.3,  needs: "tokens",
    joinText: "A merchant presses little clay tokens to keep track of trades." },
  { id: "priest",      name: "Priest",        emoji: "🔮", cost: 20000,   marksPerSecond: 20,   ideasPerSecond: 8,    needs: "sacred",
    joinText: "A priest writes prayers to the sky in sacred signs." },
  { id: "accountant",  name: "Record Keeper", emoji: "🧮", cost: 20000,   marksPerSecond: 90,   ideasPerSecond: 2,    needs: "ledgers",
    joinText: "A record keeper fills clay tablet after clay tablet with numbers." },
  { id: "scribe",      name: "Scribe",        emoji: "✍️", cost: 40000,   marksPerSecond: 60,   ideasPerSecond: 6,    needs: "syllables",
    joinText: "The first scribe dedicates their whole life to writing." },
  { id: "teacher",     name: "Teacher",       emoji: "🧑‍🏫", cost: 300000,  marksPerSecond: 300,  ideasPerSecond: 35,   needs: "alphabet",
    joinText: "A teacher gathers children to learn the letters." },
  { id: "copyist",     name: "Copyist",       emoji: "📜", cost: 4000000, marksPerSecond: 2000, ideasPerSecond: 220,  needs: "papyrus",
    joinText: "Copyists begin duplicating scrolls so ideas can travel." },
];

// ---------------------------------------------------------------------
// DISCOVERIES you buy with ideas. They form a TREE, not a straight line:
//   needs       = discoveries that must come first. "a|b" means "a OR b".
//   rival       = a CROSSROADS: choosing this one locks the rival forever
//                 (for this game). Both sides share the same `question`.
//   clickBoost  = multiplies marks per click
//   marksBoost  = multiplies marks from people
//   ideasBoost  = multiplies ideas from people
//   peopleBoost = multiplies ONE kind of person, e.g. { scribe: 5 }
//   glyphs      = symbols that appear on the cave wall after this discovery
// ---------------------------------------------------------------------
const DISCOVERIES = [
  { id: "tally", name: "Tally Marks", emoji: "𝍷", cost: 2, needs: [], clickBoost: 2,
    desc: "Clicks carve twice as much.",
    era: "The Age of Counting",
    story: "Someone realizes five scratches can mean five deer. Counting is born!",
    glyphs: ["|", "||", "|||", "||||", "𝍸"] },

  // --- Three discoveries open up at once. Pick any order! ---
  { id: "pictograms", name: "Pictograms", emoji: "🐂", cost: 25, needs: ["tally"], marksBoost: 1.5,
    desc: "Pictures stand for things. People carve 50% more. Storytellers can join.",
    era: "The Age of Pictures",
    story: "A drawing of an ox now means 'ox'. The wall starts telling stories.",
    glyphs: ["🐂", "🐟", "☀️", "🌾", "🏹", "👁️", "🌙", "🐍", "✋"] },
  { id: "tokens", name: "Clay Tokens", emoji: "🟤", cost: 40, needs: ["tally"], clickBoost: 2,
    desc: "Little clay shapes stand for sheep and grain. Clicks ×2. Merchants can join.",
    era: "The Age of Tokens",
    story: "A cone of clay means one jar of grain. Trade will never be the same.",
    glyphs: ["●", "◆", "▲", "◯", "⊙", "■"] },
  { id: "pigments", name: "Pigments", emoji: "🎨", cost: 90, needs: ["tally"], ideasBoost: 1.5,
    desc: "Ochre and soot let you paint, not just scratch. Ideas ×1.5. The wall gets color!",
    era: "The Age of Color",
    story: "Red ochre, black soot, white chalk. The cave wall bursts into color.",
    glyphs: ["✋", "🦌", "🐎", "🦬", "🌿", "🔥"] },

  // --- CROSSROADS 1: pick ONE ---
  { id: "sacred", name: "Sacred Signs", emoji: "☥", cost: 500, needs: ["pictograms", "tokens"], rival: "ledgers",
    question: "What is writing for?", ideasBoost: 2,
    desc: "Writing is for the gods. Ideas ×2. Priests can join.",
    era: "The Age of Holy Signs",
    story: "Your people decide writing is magic, a way to speak to the gods.",
    glyphs: ["☥", "👁️", "🪶", "🦅", "🌞", "🐍", "𓂀"] },
  { id: "ledgers", name: "Ledgers", emoji: "📐", cost: 500, needs: ["pictograms", "tokens"], rival: "sacred",
    question: "What is writing for?", marksBoost: 2.5,
    desc: "Writing is for keeping count. Marks ×2.5. Record Keepers can join.",
    era: "The Age of Wedges",
    story: "Your people decide writing is for keeping count: grain, sheep, debts.",
    glyphs: ["▼", "◀", "▼▼", "◀▼", "▼◀◀", "⊲"] },

  { id: "ideograms", name: "Ideograms", emoji: "☯", cost: 350, needs: ["pictograms"], marksBoost: 2, clickBoost: 2,
    desc: "Symbols stand for ideas, not just things. Everything carves 2× more.",
    era: "The Age of Symbols",
    story: "A sun with legs means 'day'. Symbols can now hold ideas.",
    glyphs: ["☉", "☽", "☯", "⚶", "♒", "✶", "⌘", "⚘"] },
  { id: "syllables", name: "Syllables", emoji: "🗨️", cost: 2500, needs: ["ideograms", "sacred|ledgers"], ideasBoost: 1.5,
    desc: "Symbols stand for sounds. Ideas ×1.5. Scribes can join.",
    era: "The Age of Sounds",
    story: "Someone writes a name by its sounds. Now anything spoken can be written!",
    glyphs: ["ka", "mu", "ri", "to", "sa", "ne", "lo", "pi"] },
  { id: "alphabet", name: "Alphabet", emoji: "🔤", cost: 15000, needs: ["syllables"], marksBoost: 1.5, clickBoost: 3,
    desc: "A few letters can write every word. Marks ×1.5, clicks ×3. Teachers can join.",
    era: "The Age of Letters",
    story: "Just a couple dozen letters can write every word. Anyone can learn!",
    glyphs: ["A", "B", "Γ", "Δ", "E", "Z", "H", "K", "M", "N", "Ω", "R"] },

  // --- CROSSROADS 2: pick ONE ---
  { id: "secret", name: "Secret Script", emoji: "🗝️", cost: 60000, needs: ["alphabet"], rival: "everyone",
    question: "Who may write?", peopleBoost: { scribe: 4, priest: 3, accountant: 3 },
    desc: "Only trained scribes may write. Scribes ×4, Priests & Record Keepers ×3.",
    era: "The Age of Secrets",
    story: "Writing becomes a guarded secret, passed from master to apprentice.",
    glyphs: ["ᚠ", "ᚢ", "ᚦ", "ᚨ", "ᚱ", "ᚲ"] },
  { id: "everyone", name: "Writing for All", emoji: "🤝", cost: 60000, needs: ["alphabet"], rival: "secret",
    question: "Who may write?", peopleBoost: { child: 15, hunter: 10, elder: 6, storyteller: 3, merchant: 3 },
    desc: "Anyone may learn! Children, Hunters, Elders, Storytellers and Merchants get MUCH stronger.",
    era: "The Age of Readers",
    story: "Writing is taught to everyone. Even children leave notes on the walls.",
    glyphs: ["hi!", "mom", "fish", "I WAS HERE", "☺", "ABC"] },

  { id: "papyrus", name: "Ink & Papyrus", emoji: "🪶", cost: 400000, needs: ["alphabet"], ideasBoost: 2,
    desc: "Writing leaves the cave. Ideas ×2. Copyists can join.",
    era: "The Age of Scrolls",
    story: "Reeds become paper, soot becomes ink. Writing can be carried anywhere.",
    glyphs: ["SUN", "RIVER", "BREAD", "HOME", "STAR", "KING", "SEED", "WE"] },
  { id: "library", name: "The Great Library", emoji: "🏛️", cost: 8000000, needs: ["papyrus", "secret|everyone"],
    marksBoost: 3, ideasBoost: 3, clickBoost: 3,
    desc: "All knowledge in one place. Everything 3× stronger.",
    era: "The Age of Memory",
    story: "A great library rises. Your people will never forget again. 🏛️ You have completed the story, for now! Try 'Start over' and pick the other crossroads.",
    glyphs: ["WE REMEMBER", "KNOW", "WORDS", "TELL", "LEARN", "WRITE"] },
];

// ---------------------------------------------------------------------
// RANDOM EVENTS — every so often one pops up and you choose what to do.
// Inside `do`, you can use these helpers:
//   gainMarks(seconds)          — get as many marks as you'd make in that many seconds
//   gainIdeas(seconds)          — same, for ideas
//   loseMarks(fraction)         — lose part of your marks (0.25 = a quarter)
//   boost(kind, times, seconds) — a temporary boost. kind is "clickBoost",
//                                 "marksBoost" or "ideasBoost". times 0 = stops it!
//   addPeople(id, count)        — free people join
// `needs` (optional) = a discovery required before this event can happen.
// ---------------------------------------------------------------------
const EVENTS = [
  { title: "🧳 A Stranger Arrives",
    text: "A traveler shows you a bone covered in symbols you've never seen.",
    choices: [
      { label: "Trade for the bone (lose 30% of marks)", result: "The strange symbols spark lots of ideas!",
        do: () => { loseMarks(0.3); gainIdeas(150); } },
      { label: "Send them away", result: "The stranger shrugs and walks on.",
        do: () => {} },
    ] },
  { title: "🦣 The Great Herd",
    text: "A huge herd of mammoths is passing through the valley.",
    choices: [
      { label: "Everyone hunts!", result: "A huge feast and many hunt tallies, but no time for thinking.",
        do: () => { gainMarks(180); boost("ideasBoost", 0, 30); } },
      { label: "Stay in the cave and think", result: "The quiet cave helps everyone think.",
        do: () => { boost("ideasBoost", 2, 45); } },
    ] },
  { title: "🌊 Flood!",
    text: "Water is pouring into the cave.",
    choices: [
      { label: "Move to a new cave (lose 25% of marks)", result: "Fresh, empty walls! Everyone carves eagerly.",
        do: () => { loseMarks(0.25); boost("marksBoost", 3, 60); } },
      { label: "Dig a channel", result: "Digging is slow, but someone has a clever idea about water.",
        do: () => { boost("marksBoost", 0.5, 40); gainIdeas(80); } },
    ] },
  { title: "🌑 The Sun Disappears!",
    text: "At midday, the sky turns dark as night.",
    choices: [
      { label: "Record it on the wall", result: "You draw the dark sun. People will remember this day.",
        do: () => { gainIdeas(90); } },
      { label: "Carve prayers, fast!", result: "Your hands carve with holy fury! (Clicks ×5)",
        do: () => { boost("clickBoost", 5, 30); } },
    ] },
  { title: "🔥 Festival Night",
    text: "Your people want a great feast to celebrate.",
    choices: [
      { label: "Hold the feast (spend 50% of marks)", result: "Stories flow all night. Ideas everywhere!",
        do: () => { loseMarks(0.5); boost("ideasBoost", 3, 60); } },
      { label: "Keep working", result: "Grumbling, everyone keeps carving.",
        do: () => { gainMarks(60); } },
    ] },
  { title: "🏕️ Neighbors",
    text: "Another tribe nearby has been making marks of their own.",
    choices: [
      { label: "Share symbols", result: "You learn from each other.",
        do: () => { gainIdeas(60); gainMarks(60); } },
      { label: "Out-carve them!", result: "A carving contest begins! (Marks ×2, Clicks ×2)",
        do: () => { boost("marksBoost", 2, 60); boost("clickBoost", 2, 60); } },
    ] },
  { title: "🧒 A Child's Question",
    text: "A child points at the wall and asks: \"What does that say?\"",
    choices: [
      { label: "Explain it patiently", result: "Teaching it makes you understand it better.",
        do: () => { gainIdeas(60); } },
      { label: "Hand them a stone", result: "Two more children join the wall!",
        do: () => { addPeople("child", 2); } },
    ] },
  { title: "📚 A Spelling Argument", needs: "syllables",
    text: "Two scribes are shouting about the right way to write a word.",
    choices: [
      { label: "Let them argue", result: "The argument produces new ideas, but less carving gets done.",
        do: () => { boost("ideasBoost", 2.5, 60); boost("marksBoost", 0.5, 60); } },
      { label: "Pick one spelling", result: "Decided! Everyone gets back to work.",
        do: () => { gainMarks(120); } },
    ] },
  { title: "🕯️ The Lamp Oil Runs Low", needs: "pictograms",
    text: "The cave is getting dark. There's only a little oil left.",
    choices: [
      { label: "Work by firelight", result: "Smoky, but you keep going. Clicks ×3!",
        do: () => { boost("clickBoost", 3, 45); } },
      { label: "Rest until morning", result: "Everyone sleeps well and wakes up full of ideas.",
        do: () => { boost("marksBoost", 0, 20); gainIdeas(120); } },
    ] },
];

// How often events pop up (in seconds, chosen randomly between these)
const EVENT_EVERY_MIN = 60;
const EVENT_EVERY_MAX = 140;
const EVENT_LASTS = 30;          // seconds before an ignored event goes away

// The glowing crack: a bonus you click on the wall
const CRACK_EVERY_MIN = 35;
const CRACK_EVERY_MAX = 90;
const CRACK_LASTS = 8;

// Every time you hire a person, their price is multiplied by this.
// 1.15 means "15% more expensive each time". Bigger = harder game.
const PRICE_GROWTH = 1.15;

// Marks per click before any discoveries.
const BASE_CLICK = 1;

// The symbols carved before any discovery: simple scratches.
const FIRST_GLYPHS = ["|", "/", "\\", "—", "×", "⌒"];

// Ideas start showing up once you have carved this many marks in total.
const IDEAS_APPEAR_AT = 10;

// Speed of the whole game. Set to 10 to test things quickly. Normal = 1.
const GAME_SPEED = 1;


/* =====================================================================
   GAME STATE — everything the game needs to remember
   ===================================================================== */

function newGame() {
  return {
    marks: 0,
    ideas: 0,
    totalMarks: 0,       // all marks ever carved (never goes down)
    time: 0,             // seconds of game time played
    people: {},          // e.g. { child: 3, hunter: 1 }
    discovered: [],      // discovery ids, in the order you made them
    effects: [],         // temporary boosts: { kind, times, until, label }
    log: [],             // story messages
    nextEventAt: randomBetween(EVENT_EVERY_MIN, EVENT_EVERY_MAX),
    nextCrackAt: randomBetween(CRACK_EVERY_MIN, CRACK_EVERY_MAX),
    lastSaved: Date.now(),
  };
}

function randomBetween(a, b) { return a + Math.random() * (b - a); }
function pickRandom(list)    { return list[Math.floor(Math.random() * list.length)]; }

let state = newGame();


/* =====================================================================
   RULES — little functions that calculate things
   ===================================================================== */

function howMany(id)       { return state.people[id] || 0; }
function hasDiscovered(id) { return id === "" || state.discovered.includes(id); }
function findDiscovery(id) { return DISCOVERIES.find(d => d.id === id); }

// Are all of a discovery's "needs" met? ("a|b" means either one is fine)
function needsMet(d) {
  return d.needs.every(need => need.split("|").some(hasDiscovered));
}

// Was this discovery locked out by choosing its rival at a crossroads?
function isLockedOut(d) {
  return d.rival && hasDiscovered(d.rival);
}

function isAvailable(d) {
  return !hasDiscovered(d.id) && needsMet(d) && !isLockedOut(d);
}

// Price of the next person of this kind
function priceOf(person) {
  return Math.ceil(person.cost * Math.pow(PRICE_GROWTH, howMany(person.id)));
}

// Multiply together a boost from every discovery + every active effect
function totalBoost(kind) {
  let result = 1;
  for (const id of state.discovered) {
    const d = findDiscovery(id);
    if (d && d[kind]) result *= d[kind];
  }
  for (const e of state.effects) {
    if (e.kind === kind) result *= e.times;
  }
  return result;
}

// Extra strength for one kind of person (from things like Secret Script)
function personBoost(person) {
  let result = 1;
  for (const id of state.discovered) {
    const d = findDiscovery(id);
    if (d && d.peopleBoost && d.peopleBoost[person.id]) result *= d.peopleBoost[person.id];
  }
  return result;
}

function marksPerSecond() {
  let total = 0;
  for (const p of PEOPLE) total += p.marksPerSecond * howMany(p.id) * personBoost(p);
  return total * totalBoost("marksBoost");
}

function ideasPerSecond() {
  let total = 0;
  for (const p of PEOPLE) total += p.ideasPerSecond * howMany(p.id) * personBoost(p);
  return total * totalBoost("ideasBoost");
}

function marksPerClick() {
  return BASE_CLICK * totalBoost("clickBoost");
}

// The most recent discovery (decides the era name + wall symbols)
function latestDiscovery() {
  return findDiscovery(state.discovered[state.discovered.length - 1]);
}

function addMarks(amount) {
  state.marks += amount;
  state.totalMarks += amount;
}

// Turn big numbers into short readable text: 1234567 -> "1.23M"
function pretty(n) {
  if (n > 0 && n < 1) return parseFloat(n.toFixed(2)).toString();   // e.g. 0.05
  if (n < 10)   return (Math.floor(n * 10) / 10).toString();
  if (n < 1000) return Math.floor(n).toString();
  const units = ["", "K", "M", "B", "T", "Qa", "Qi"];
  let i = 0;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  return n.toFixed(2) + units[i];
}


/* =====================================================================
   HELPERS FOR EVENTS — used in the EVENTS list above
   ===================================================================== */

// Base rates WITHOUT temporary effects, so events don't snowball
function baseRate(kind) {
  const saved = state.effects;
  state.effects = [];
  const rate = kind === "marks" ? marksPerSecond() : ideasPerSecond();
  state.effects = saved;
  return rate;
}

function gainMarks(seconds) {
  // Early on you make almost nothing per second, so clicks count too
  const amount = Math.max(baseRate("marks") * seconds, marksPerClick() * seconds / 4);
  addMarks(amount);
  return amount;
}

function gainIdeas(seconds) {
  const amount = Math.max(baseRate("ideas") * seconds, seconds / 20);
  state.ideas += amount;
  return amount;
}

function loseMarks(fraction) {
  state.marks *= (1 - fraction);
}

const BOOST_NAMES = { clickBoost: "Clicks", marksBoost: "Marks", ideasBoost: "Ideas" };

function boost(kind, times, seconds) {
  state.effects.push({ kind, times, until: state.time + seconds });
}

function addPeople(id, count) {
  state.people[id] = howMany(id) + count;
}


/* =====================================================================
   STORY LOG
   ===================================================================== */

function tell(text) {
  state.log.unshift(text);
  state.log = state.log.slice(0, 40);   // keep the 40 newest
  drawLog();
}

function drawLog() {
  document.getElementById("log").innerHTML = state.log.map(t => `<p>${t}</p>`).join("");
}


/* =====================================================================
   THE CAVE WALL — symbols appear where marks are carved
   ===================================================================== */

const wall = document.getElementById("wall");
const MAX_GLYPHS = 160;   // oldest symbols fade away after this many
const PAINT_COLORS = ["#c8643c", "#e8b070", "#2b1d16", "#f1e6d6", "#a33a2a"];

function currentGlyphs() {
  const d = latestDiscovery();
  return d ? d.glyphs : FIRST_GLYPHS;
}

// Carve one symbol at x%, y% (random if not given)
function carveGlyph(xPercent, yPercent) {
  const g = document.createElement("div");
  g.className = "glyph";
  g.textContent = pickRandom(currentGlyphs());
  g.style.left = (xPercent ?? 4 + Math.random() * 88) + "%";
  g.style.top  = (yPercent ?? 6 + Math.random() * 82) + "%";
  g.style.fontSize = (14 + Math.random() * 18) + "px";
  g.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 30 - 15}deg)`;
  if (hasDiscovered("pigments")) {
    g.classList.add("painted");
    g.style.color = pickRandom(PAINT_COLORS);
  }
  wall.appendChild(g);

  const all = wall.querySelectorAll(".glyph");
  if (all.length > MAX_GLYPHS) all[0].remove();
}

wall.addEventListener("click", (event) => {
  const box = wall.getBoundingClientRect();
  const x = (event.clientX - box.left) / box.width * 100;
  const y = (event.clientY - box.top) / box.height * 100;
  const gained = marksPerClick();
  addMarks(gained);
  carveGlyph(x, y);
  showFloater("+" + pretty(gained), event.clientX, event.clientY);
  document.getElementById("wallHint").classList.add("hidden");
  updateScreen();
});

function showFloater(text, x, y, color) {
  const el = document.createElement("div");
  el.className = "floater";
  el.textContent = text;
  el.style.left = (x + 8) + "px";
  el.style.top  = (y - 24) + "px";
  if (color) el.style.color = color;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}


/* =====================================================================
   THE GLOWING CRACK — click it quickly for a bonus
   ===================================================================== */

let crack = null;
let crackGoneAt = 0;

function spawnCrack() {
  crack = document.createElement("div");
  crack.className = "crack";
  crack.textContent = "✨";
  crack.style.left = (10 + Math.random() * 80) + "%";
  crack.style.top  = (12 + Math.random() * 70) + "%";
  crack.addEventListener("click", (event) => {
    event.stopPropagation();          // don't also count as a normal wall click
    if (Math.random() < 0.5) {
      const got = gainMarks(90);
      tell(`✨ You find a vein of perfect flint! +${pretty(got)} marks.`);
      showFloater("+" + pretty(got), event.clientX, event.clientY);
    } else {
      boost("clickBoost", 7, 15);
      tell("✨ The rock here is soft as butter! Clicks ×7 for 15 seconds.");
      showFloater("Clicks ×7!", event.clientX, event.clientY);
    }
    removeCrack();
    updateScreen();
  });
  wall.appendChild(crack);
  crackGoneAt = state.time + CRACK_LASTS;
}

function removeCrack() {
  if (crack) crack.remove();
  crack = null;
  state.nextCrackAt = state.time + randomBetween(CRACK_EVERY_MIN, CRACK_EVERY_MAX);
}


/* =====================================================================
   RANDOM EVENTS — show a card with choices
   ===================================================================== */

let currentEvent = null;
let eventEndsAt = 0;

function startEvent() {
  const possible = EVENTS.filter(e => !e.needs || hasDiscovered(e.needs));
  currentEvent = pickRandom(possible);
  eventEndsAt = state.time + EVENT_LASTS;

  document.getElementById("eventTitle").textContent = currentEvent.title;
  document.getElementById("eventText").textContent  = currentEvent.text;
  const box = document.getElementById("eventChoices");
  box.innerHTML = "";
  for (const choice of currentEvent.choices) {
    const btn = document.createElement("button");
    btn.textContent = choice.label;
    btn.addEventListener("click", () => {
      choice.do();
      tell(`${currentEvent.title}: ${choice.result}`);
      endEvent();
      updateScreen();
    });
    box.appendChild(btn);
  }
  document.getElementById("eventCard").classList.remove("hidden");
}

function endEvent() {
  currentEvent = null;
  document.getElementById("eventCard").classList.add("hidden");
  state.nextEventAt = state.time + randomBetween(EVENT_EVERY_MIN, EVENT_EVERY_MAX);
}


/* =====================================================================
   BUILDING THE SHOP BUTTONS
   ===================================================================== */

function makeButton(container, onClick) {
  const btn = document.createElement("button");
  btn.className = "shop-item";
  btn.addEventListener("click", onClick);
  container.appendChild(btn);
  return btn;
}

for (const p of PEOPLE) {
  p.button = makeButton(document.getElementById("people"), () => {
    const price = priceOf(p);
    if (state.marks < price) return;
    state.marks -= price;
    if (howMany(p.id) === 0) tell(`${p.emoji} ${p.joinText}`);
    state.people[p.id] = howMany(p.id) + 1;
    updateScreen();
  });
}

for (const d of DISCOVERIES) {
  d.button = makeButton(document.getElementById("discoveries"), () => {
    if (!isAvailable(d) || state.ideas < d.cost) return;
    state.ideas -= d.cost;
    state.discovered.push(d.id);
    tell(`${d.emoji} <b>${d.name}!</b> ${d.story}`);
    if (d.rival) tell(`⚖️ You chose ${d.name}. ${findDiscovery(d.rival).name} is lost to history (this time).`);
    for (let i = 0; i < 6; i++) carveGlyph();   // show off the new symbols
    updateScreen();
  });
}

// Only touch a button's HTML when its text changes (so clicks aren't lost)
function setHtml(element, html) {
  if (element.lastHtml !== html) { element.innerHTML = html; element.lastHtml = html; }
}


/* =====================================================================
   UPDATING THE SCREEN — copies numbers from the state onto the page
   ===================================================================== */

function updateScreen() {
  document.getElementById("marks").textContent          = pretty(state.marks);
  document.getElementById("marksPerSecond").textContent = pretty(marksPerSecond());
  document.getElementById("ideas").textContent          = pretty(state.ideas);
  document.getElementById("ideasPerSecond").textContent = pretty(ideasPerSecond());

  const latest = latestDiscovery();
  document.getElementById("eraName").textContent = latest ? latest.era : "The Age of Scratches";

  // Active effects
  document.getElementById("effects").innerHTML = state.effects.map(e => {
    const good = e.times >= 1;
    const label = e.times === 0 ? `${BOOST_NAMES[e.kind]} stopped` : `${BOOST_NAMES[e.kind]} ×${e.times}`;
    return `<span class="effect ${good ? "good" : "bad"}">${label} (${Math.ceil(e.until - state.time)}s)</span>`;
  }).join("");

  // Ideas + discoveries appear after the first few marks
  const ideasVisible = state.totalMarks >= IDEAS_APPEAR_AT;
  document.getElementById("ideasBox").classList.toggle("hidden", !ideasVisible);
  document.getElementById("discoveriesPanel").classList.toggle("hidden", !ideasVisible);

  // People: only show the ones whose discovery has happened
  for (const p of PEOPLE) {
    const price = priceOf(p);
    const canAfford = state.marks >= price;
    const extra = personBoost(p);
    let what = `+${pretty(p.marksPerSecond * extra)} marks/sec`;
    if (p.ideasPerSecond) what += `, +${pretty(p.ideasPerSecond * extra)} ideas/sec`;
    p.button.classList.toggle("hidden", !hasDiscovered(p.needs));
    p.button.disabled = !canAfford;
    p.button.classList.toggle("affordable", canAfford);
    setHtml(p.button, `
      <div>
        <div class="name">${p.emoji} ${p.name}${extra > 1 ? ` <span class="ideas-color">×${extra}</span>` : ""}</div>
        <div class="desc">${what} each</div>
        <div class="desc">Costs ${pretty(price)} marks</div>
      </div>
      <div class="owned">${howMany(p.id)}</div>`);
  }

  // Discoveries: show every one you could research right now
  let unknown = 0;
  for (const d of DISCOVERIES) {
    const available = isAvailable(d);
    if (!available && !hasDiscovered(d.id) && !isLockedOut(d)) unknown++;
    const canAfford = available && state.ideas >= d.cost;
    d.button.classList.toggle("hidden", !available);
    d.button.classList.toggle("crossroads", !!d.rival);
    d.button.classList.toggle("affordable", canAfford);
    d.button.disabled = !canAfford;
    setHtml(d.button, `
      <div>
        ${d.rival ? `<div class="choice-label">⚖️ Crossroads: ${d.question} (choose one)</div>` : ""}
        <div class="name">${d.emoji} ${d.name}</div>
        <div class="desc">${d.desc}</div>
        <div class="desc">Costs ${pretty(d.cost)} ideas</div>
      </div>`);
  }

  setHtml(document.getElementById("discoveredList"),
    state.discovered.map(id => { const d = findDiscovery(id); return `<span title="${d.name}">${d.emoji}</span>`; }).join(""));
  setHtml(document.getElementById("unknownCount"),
    unknown ? `❓ ${unknown} more discoveries not yet imagined…` : "");

  // Event countdown bar
  if (currentEvent) {
    const left = Math.max(0, (eventEndsAt - state.time) / EVENT_LASTS);
    document.getElementById("eventTimer").style.width = (left * 100) + "%";
  }
}


/* =====================================================================
   SAVING & LOADING — uses the browser's built-in storage
   ===================================================================== */

const SAVE_KEY = "first-marks-save-v2";

function save() {
  state.lastSaved = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) { /* saving not allowed here */ }
}

function load() {
  try {
    const text = localStorage.getItem(SAVE_KEY);
    if (!text) return false;
    state = Object.assign(newGame(), JSON.parse(text));

    // Offline progress: your people kept working while you were away
    const secondsAway = (Date.now() - state.lastSaved) / 1000 * GAME_SPEED;
    state.effects = [];   // temporary boosts don't last while you're gone
    const marksEarned = marksPerSecond() * secondsAway;
    const ideasEarned = ideasPerSecond() * secondsAway;
    if (marksEarned >= 1) {
      addMarks(marksEarned);
      state.ideas += ideasEarned;
      tell(`🌙 While you were away, your people carved ${pretty(marksEarned)} marks and had ${pretty(ideasEarned)} ideas.`);
    }
    return true;
  } catch (e) { return false; }   // bad save — start fresh
}

document.getElementById("resetButton").addEventListener("click", () => {
  if (confirm("Really start over? You will lose all progress.")) {
    state = newGame();
    wall.querySelectorAll(".glyph").forEach(g => g.remove());
    if (crack) { crack.remove(); crack = null; }
    if (currentEvent) endEvent();
    document.getElementById("wallHint").classList.remove("hidden");
    tell("🔥 A lone figure sits in a dark cave, holding a sharp stone…");
    save();
    updateScreen();
  }
});


/* =====================================================================
   THE GAME LOOP — runs 10 times per second, forever
   ===================================================================== */

if (!load()) tell("🔥 A lone figure sits in a dark cave, holding a sharp stone…");
drawLog();
if (state.totalMarks > 0) {
  document.getElementById("wallHint").classList.add("hidden");
  for (let i = 0; i < Math.min(60, state.totalMarks); i++) carveGlyph();
}
updateScreen();

let ideasAnnounced = state.totalMarks >= IDEAS_APPEAR_AT;
let lastTick = Date.now();

setInterval(() => {
  const now = Date.now();
  const seconds = (now - lastTick) / 1000 * GAME_SPEED;
  lastTick = now;
  state.time += seconds;

  // Remove temporary effects that have run out
  state.effects = state.effects.filter(e => e.until > state.time);

  const newMarks = marksPerSecond() * seconds;
  addMarks(newMarks);
  state.ideas += ideasPerSecond() * seconds;

  // People carving also shows up on the wall (a little, so it doesn't flood)
  if (Math.random() < Math.min(0.6, newMarks / 3)) carveGlyph();

  if (!ideasAnnounced && state.totalMarks >= IDEAS_APPEAR_AT) {
    ideasAnnounced = true;
    tell("💡 Looking at the marks, you get a strange feeling… could they <i>mean</i> something? (Ideas unlocked! Curious children and elders will help you think.)");
  }

  // Random events start after your first discovery
  if (state.discovered.length > 0) {
    if (!currentEvent && state.time >= state.nextEventAt) startEvent();
    if (currentEvent && state.time >= eventEndsAt) {
      tell(`${currentEvent.title}: You hesitated, and the moment passed.`);
      endEvent();
    }
    if (!crack && state.time >= state.nextCrackAt) spawnCrack();
    if (crack && state.time >= crackGoneAt) removeCrack();
  }

  updateScreen();
}, 100);

setInterval(save, 5000);                        // auto-save every 5 seconds
window.addEventListener("beforeunload", save);  // and when you close the tab
</script>
</body>
</html>
